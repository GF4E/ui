<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--background); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--background); font-family: var(--font-sans); }
  .cover svg { position: absolute; inset: 0; }
  .primary { fill: var(--primary); }
  .c1 { fill: var(--chart-1); }
  .c3 { fill: var(--chart-3); }
  .c5 { fill: var(--chart-5); }
  .destructive { fill: var(--destructive); }
  .lg { rx: var(--radius); }
  .xl { rx: calc(var(--radius) * 1.4); }
  .name { position: absolute; left: 40px; bottom: 64px; max-width: 440px; margin: 0; color: var(--foreground); font-size: 80px; line-height: 0.95; font-weight: 800; letter-spacing: -0.025em; }
  .tag { position: absolute; left: 40px; bottom: 36px; max-width: 440px; margin: 0; color: var(--muted-foreground); font-size: 14px; line-height: 20px; }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!-- blocks: primary x4 (two 2-wide), chart-1 x5, chart-3 x4, chart-5 x5, destructive x1 (state, smallest share)
         arrangement: flush modular grid right of x=480, merged two-wide tiles like grouped controls
         pattern: "geometric, modular, dense UI" - Nova is compact (h-8 controls) and built from composable parts
         scales: tile 56px = 14 x spacing, gutter 8px = 2 x spacing; corners rx = radius (lg), radius x 1.4 (xl) on merged tiles -->
    <rect class="primary xl" x="496" y="24" width="120" height="56" rx="14"/>
    <rect class="c3 lg" x="624" y="24" width="56" height="56" rx="10"/>
    <rect class="c1 lg" x="688" y="24" width="56" height="56" rx="10"/>
    <rect class="c5 xl" x="752" y="24" width="120" height="56" rx="14"/>
    <rect class="c1 lg" x="496" y="88" width="56" height="56" rx="10"/>
    <rect class="c5 lg" x="560" y="88" width="56" height="56" rx="10"/>
    <rect class="primary xl" x="624" y="88" width="120" height="56" rx="14"/>
    <rect class="c3 lg" x="752" y="88" width="56" height="56" rx="10"/>
    <rect class="c1 lg" x="816" y="88" width="56" height="56" rx="10"/>
    <rect class="c3 lg" x="496" y="152" width="56" height="56" rx="10"/>
    <rect class="c1 xl" x="560" y="152" width="120" height="56" rx="14"/>
    <rect class="primary lg" x="688" y="152" width="56" height="56" rx="10"/>
    <rect class="destructive lg" x="752" y="152" width="56" height="56" rx="10"/>
    <rect class="c5 lg" x="816" y="152" width="56" height="56" rx="10"/>
    <rect class="c5 xl" x="496" y="216" width="120" height="56" rx="14"/>
    <rect class="c1 lg" x="624" y="216" width="56" height="56" rx="10"/>
    <rect class="c3 lg" x="688" y="216" width="56" height="56" rx="10"/>
    <rect class="primary xl" x="752" y="216" width="120" height="56" rx="14"/>
  </svg>
  <p class="name">shadcn/ui</p>
  <p class="tag">The Foundation for your Design System</p>
</div>
</body>
</html>
